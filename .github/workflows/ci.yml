name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests and type check link the installed pi's packages; install the pi version pi-retainer targets.
      - run: pnpm add --global @earendil-works/pi-coding-agent@1.2.0
      - run: pnpm check
      - name: The packed tarball has the extension and nothing else it should not
        run: |
          pnpm pack
          tar tzf pi-retainer-*.tgz | grep -q '^package/extensions/retainer/index.ts$'
          ! tar tzf pi-retainer-*.tgz | grep -E '^package/(test|scripts|\.github)/'
      - name: The pi-domain bridge bundles this version and points at its extension
        run: |
          node scripts/build-domain-bridge.mjs
          node -e 'const p=require("./compat/pi-domain/package.json"); const fs=require("fs"); for (const e of p.pi.extensions) if (!fs.existsSync("compat/pi-domain/"+e)) { console.error("missing " + e); process.exit(1); }'
          (cd compat/pi-domain && npm pack --dry-run --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"))[0]; if (!d.files.some((f) => f.path === "node_modules/pi-retainer/extensions/retainer/index.ts")) process.exit(1)')
